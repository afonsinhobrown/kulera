<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kulera+ | Finalizar compra</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top"><a href="index.html" style="color:#fff;text-decoration:none">Kulera<span style="color:var(--gold)">+</span></a></div>
<main>
  <section class="panel" style="max-width:520px">
    <h1 style="font-size:28px">Finalizar compra</h1>
    <div id="info" style="text-align:center"></div>
    <div style="background:#e8f4f5;border:1px solid #c2e2e5;border-radius:8px;padding:12px 14px;margin:12px 0;font-size:14px;color:#18454b;line-height:1.45;display:flex;gap:10px;align-items:flex-start">
      <span style="font-size:18px">📖</span>
      <div><b>Como vai ler o seu livro?</b><br>Não precisa de criar conta. Assim que o pagamento for concluído, o seu livro abre automaticamente aqui e recebe o link de acesso no telemóvel/email para ler quando quiser.</div>
    </div>
    <form id="form" novalidate>
      <label>Nome completo<input name="name" autocomplete="name" required maxlength="80"></label>
      <label>Telefone (M-Pesa / e-Mola)<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="84 000 0000" required></label>
      <label>Email <small>(opcional)</small><input name="email" type="email" autocomplete="email"></label>
      <div id="ship" hidden>
        <h2 style="font:700 20px Georgia,serif;margin:8px 0">Dados de entrega</h2>
        <label>Nome para entrega<input name="shippingName"></label>
        <label>Telefone para entrega<input name="shippingPhone"></label>
        <label>Morada completa<input name="shippingAddress" required></label>
        <label>Cidade/Província<input name="shippingCity"></label>
      </div>
      <p class="msg" id="msg" role="alert"></p>
      <button id="go" type="submit">Ir para pagamento</button>
    </form>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const errors={invalid_name:'Escreva o seu nome.',invalid_phone:'Escreva um número de telemóvel válido, só com números.',invalid_email:'O email não parece válido.',book_unavailable:'Este livro já não está disponível.',payment_unavailable:'Não foi possível iniciar o pagamento. Tente novamente.',invalid_address:'Indique a morada para entrega.',invalid_format:'Escolha um formato válido.'};
const money=(m,c)=>{try{return new Intl.NumberFormat('pt-MZ',{style:'currency',currency:c}).format(m/100)}catch{return (m/100).toFixed(2)+' '+c}};
const id=new URLSearchParams(location.search).get('id');
let b=null,fmt='digital';
function priceFor(f){return f==='physical'?(b.physicalPriceMinor??b.priceMinor):(b.digitalPriceMinor??b.priceMinor)}
function applyFmt(){const physical=fmt==='physical';$('ship').hidden=!physical;const f=$('form');if(physical){if(!f.shippingName.value)f.shippingName.value=f.name.value||'';if(!f.shippingPhone.value)f.shippingPhone.value=f.phone.value||'';}const pe=$('fmtPrice');if(pe)pe.textContent=money(priceFor(fmt),b.currency);$('go').textContent=(physical?'Pagar (entrega) ':'Pagar ')+money(priceFor(fmt),b.currency);}
async function load(){
  const r=await fetch('/api/books'); const list=await r.json();
  b=(list||[]).find(x=>x.id===id);
  if(!b){$('info').innerHTML='<p class="msg err">Livro não encontrado.</p>'; $('form').hidden=true; return;}
  const hasD=b.hasDigital!==false, hasP=b.hasPhysical===true||b.requiresShipping===true;
  fmt=hasD?'digital':'physical';
  const badge=[hasD?'E-book':null,hasP?'Físico':null].filter(Boolean).join(' + ');
  let coverHtml = '';
  if(b.coverUrl){
    coverHtml = '<div class="cover" style="max-width:160px;margin:12px auto 16px"><img src="'+b.coverUrl+'" alt="Capa"></div>';
  } else {
    coverHtml = '<div class="cover" style="max-width:160px;margin:12px auto 16px"><span style="font-size:15px;padding:8px">'+b.title+'</span></div>';
  }
  let html=coverHtml+'<p style="margin:4px 0"><b>'+b.title+'</b><br><span style="color:#557077">'+b.author+'</span><br><small style="color:var(--sea);font-weight:600">'+badge+'</small><br><span class="price" id="fmtPrice" style="font-size:24px;display:inline-block;margin:10px 0 4px"></span></p>';
  if(hasD&&hasP){html+='<p style="margin:10px 0"><b>Formato:</b> <label style="display:inline-flex;gap:6px;align-items:center;font-weight:400"><input type="radio" name="fmt" value="digital" checked style="width:auto"> E-book (digital) — '+money(priceFor('digital'),b.currency)+'</label> <label style="display:inline-flex;gap:6px;align-items:center;font-weight:400"><input type="radio" name="fmt" value="physical" style="width:auto"> Físico (entrega) — '+money(priceFor('physical'),b.currency)+'</label></p>';}
  $('info').innerHTML=html;
  document.querySelectorAll('[name=fmt]').forEach(x=>x.onchange=()=>{fmt=x.value;applyFmt();});
  const f=$('form'); f.name.oninput=()=>{if(fmt==='physical')f.shippingName.value=f.name.value}; f.phone.oninput=()=>{if(fmt==='physical')f.shippingPhone.value=f.phone.value};
  applyFmt();
  f.onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target),msg=$('msg'),btn=$('go');
    msg.className='msg';msg.textContent='';btn.disabled=true;const label=btn.textContent;btn.textContent='A abrir pagamento...';
    try{
      const body={bookId:b.id,format:fmt,name:fd.get('name'),phone:fd.get('phone'),email:fd.get('email')};
      if(fmt==='physical'){body.shippingName=fd.get('shippingName');body.shippingPhone=fd.get('shippingPhone');body.shippingAddress=fd.get('shippingAddress');body.shippingCity=fd.get('shippingCity');}
      const rr=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const j=await rr.json();if(!rr.ok)throw new Error(j.error);
      try{localStorage.setItem('kulera_token',j.token)}catch{}
      location.href=j.checkoutUrl;
    }catch(err){msg.className='msg err';msg.textContent=errors[err.message]||'Algo correu mal. Tente novamente.';btn.disabled=false;btn.textContent=label}
  };
}
load();
</script>
</body>
</html>
