<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kulera+ | Finalizar compra</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top"><a href="index.html" style="color:#fff;text-decoration:none">Kulera<span style="color:var(--gold)">+</span></a></div>
<main>
  <section class="panel" style="max-width:520px">
    <h1 style="font-size:28px">Finalizar compra</h1>
    <div id="info"></div>
    <form id="form" novalidate>
      <label>Nome completo<input name="name" autocomplete="name" required maxlength="80"></label>
      <label>Telefone (M-Pesa / e-Mola)<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="84 000 0000" required></label>
      <label>Email <small>(opcional)</small><input name="email" type="email" autocomplete="email"></label>
      <p class="msg" id="msg" role="alert"></p>
      <button id="go" type="submit">Ir para pagamento</button>
    </form>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const errors={invalid_name:'Escreva o seu nome.',invalid_phone:'Escreva um número de telemóvel válido, só com números.',invalid_email:'O email não parece válido.',book_unavailable:'Este livro já não está disponível.',payment_unavailable:'Não foi possível iniciar o pagamento. Tente novamente.'};
const money=(m,c)=>{try{return new Intl.NumberFormat('pt-MZ',{style:'currency',currency:c}).format(m/100)}catch{return (m/100).toFixed(2)+' '+c}};
const id=new URLSearchParams(location.search).get('id');
async function load(){
  const r=await fetch('/api/books'); const list=await r.json();
  const b=(list||[]).find(x=>x.id===id);
  if(!b){$('info').innerHTML='<p class="msg err">Livro não encontrado.</p>'; $('form').hidden=true; return;}
  $('info').innerHTML='<p><b>'+b.title+'</b><br>'+b.author+'<br><span class="price" style="font-size:24px">'+money(b.priceMinor,b.currency)+'</span></p>';
  $('form').onsubmit=async e=>{
    e.preventDefault();const f=new FormData(e.target),msg=$('msg'),btn=$('go');
    msg.className='msg';msg.textContent='';btn.disabled=true;const label=btn.textContent;btn.textContent='A abrir pagamento...';
    try{
      const rr=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookId:b.id,name:f.get('name'),phone:f.get('phone'),email:f.get('email')})});
      const j=await rr.json();if(!rr.ok)throw new Error(j.error);
      try{localStorage.setItem('kulera_token',j.token)}catch{}
      location.href=j.checkoutUrl;
    }catch(err){msg.className='msg err';msg.textContent=errors[err.message]||'Algo correu mal. Tente novamente.';btn.disabled=false;btn.textContent=label}
  };
}
load();
</script>
</body>
</html>
